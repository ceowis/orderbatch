spring:
  datasource:
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always
      schema-locations:
        - classpath:schema.sql
      data-locations:
        - classpath:data.sql

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false   # 애플리케이션 시작 시 자동 실행 방지 (수동 트리거)

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
  type-aliases-package: com.example.orderbatch.domain

logging:
  level:
    com.example.orderbatch: DEBUG
    org.springframework.batch: INFO
    org.mybatis: DEBUG

# 배치 청크 사이즈 설정
batch:
  chunk-size: 10
  order-processing:
    status-from: PENDING
    status-to: PROCESSED
